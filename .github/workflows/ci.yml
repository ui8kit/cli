name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22, 24]
        include:
          - os: windows-latest
            node-version: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: npm run pack:check
      - name: E2E against the synthetic fixture registry (built CLI)
        run: node scripts/e2e-fixture-registry.mjs
      - name: Verify bin shebang
        shell: bash
        run: head -n 1 dist/index.js | grep -q '^#!/usr/bin/env node$'

  live:
    # Built CLI against the real default registry (registry.buildy.tw): add without init.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm run build
      - name: add button -y --framework <rt> in fresh dirs (no init, no --registry-url)
        shell: bash
        run: |
          set -euo pipefail
          cli="$PWD/dist/index.js"
          check() { # runtime, expected file
            d="$(mktemp -d)"; (cd "$d" && node "$cli" add button -y --framework "$1")
            test -f "$d/$2" || { echo "missing $2 for $1"; find "$d" -path "$d/node_modules" -prune -o -type f -print; exit 1; }
            jq -e '.["$schema"] == "https://registry.buildy.tw/schema/config.json"' "$d/ui8kit.config.json"
            grep -q "\"source\": \"https://registry.buildy.tw/$1\"" "$d/ui8kit.lock.json"
            echo "ok $1 -> $2"
          }
          # registry.buildy.tw since site c70e531: the kit primitive under kit/ui, its compose wrapper under compose/
          check react  src/kit/ui/button/button.tsx
          check react  src/compose/button.tsx
          check vue    src/kit/ui/button/Button.vue
          check vue    src/compose/Button.vue
          check templ  src/ui/button/button.templ
          check jinja2 src/ui/button/button.html.j2
          # Select sizes pl-3 pr-2 (codegen 66736dd, @ui8kit/registry 3.3.1, kit-compose select recipe)
          for rt in react vue templ jinja2; do
            d="$(mktemp -d)"; (cd "$d" && node "$cli" add select -y --framework "$rt" >/dev/null)
            grep -rq "pl-3 pr-2" "$d/src" || { echo "select of $rt has no pl-3 pr-2"; exit 1; }
            echo "ok $rt select pl-3 pr-2"
          done
          d="$(mktemp -d)"; if (cd "$d" && node "$cli" add button -y --framework webcomponent); then echo "webcomponent must be rejected"; exit 1; fi
